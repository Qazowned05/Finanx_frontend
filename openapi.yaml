components:
  schemas:
    WalletRequest:
      required:
      - currencyCode
      type: object
      properties:
        currencyCode:
          maxLength: 3
          minLength: 3
          type: string
          description: Codigo de moneda (ISO 4217)
          example: PEN
        primary:
          type: boolean
          description: Indica si es la billetera principal
          example: true
      description: Solicitud para crear o actualizar una billetera
    WalletResponse:
      type: object
      properties:
        id:
          type: integer
          description: Identificador unico de la billetera
          format: int64
          example: 1
        userId:
          type: integer
          description: Identificador del usuario propietario
          format: int64
          example: 42
        currencyCode:
          type: string
          description: Codigo de moneda (ISO 4217)
          example: PEN
        balance:
          type: number
          description: Balance actual
          example: 1500.0
        primary:
          type: boolean
          description: Indica si es la billetera principal
          example: true
      description: Respuesta que representa una billetera
    UserRequest:
      required:
      - email
      - lastname
      - name
      - password
      - username
      type: object
      properties:
        name:
          minLength: 1
          type: string
          description: Nombres del usuario
          example: Jorge Jackson
        lastname:
          minLength: 1
          type: string
          description: Apellidos del usuario
          example: Valdivia Torreon
        email:
          minLength: 1
          type: string
          description: Correo electronico del usuario
          format: email
          example: jorge.valdivia@example.com
        username:
          minLength: 1
          type: string
          description: Nombre de usuario unico
          example: UsuarioFin2026
        password:
          minLength: 1
          type: string
          description: Contrasena del usuario
          example: StrongPassword123!
      description: Solicitud para registrar un nuevo usuario en el sistema
    Role:
      type: string
      description: Rol asignado al usuario
      example: USER
      enum:
      - USER
      - SYSTEM
    TimeZone:
      type: string
      description: Zona horaria preferida
      example: AMERICA_LIMA
      enum:
      - AMERICA_LIMA
      - AMERICA_BOGOTA
      - AMERICA_QUITO
      - AMERICA_CARACAS
      - AMERICA_LA_PAZ
      - AMERICA_ASUNCION
      - AMERICA_MONTEVIDEO
      - AMERICA_SANTIAGO
      - AMERICA_BUENOS_AIRES
      - AMERICA_GUATEMALA
      - AMERICA_COSTA_RICA
      - AMERICA_TEGUCIGALPA
      - AMERICA_EL_SALVADOR
      - AMERICA_MANAGUA
      - AMERICA_PANAMA
      - AMERICA_HAVANA
      - AMERICA_SANTO_DOMINGO
      - AMERICA_PUERTO_RICO
      - AMERICA_MEXICO_CITY
      - EUROPE_MADRID
      - AFRICA_CEUTA
      - ATLANTIC_CANARY
      - AMERICA_NEW_YORK
      - AMERICA_LOS_ANGELES
    UserPreferencesResponse:
      type: object
      properties:
        id:
          type: integer
          description: Identificador unico
          format: int64
          example: 1
        timeZone:
          $ref: "#/components/schemas/TimeZone"
        currencyCode:
          type: string
          description: Codigo de moneda por defecto
          example: PEN
        emailNotifications:
          type: boolean
          description: Notificaciones por email habilitadas
          example: true
        fcmTokens:
          type: array
          description: Tokens FCM registrados
          example:
          - fM8x...abc123
          items:
            type: string
            description: Tokens FCM registrados
            example: "[\"fM8x...abc123\"]"
        createdAt:
          type: string
          description: Fecha de creacion
          format: date-time
        updatedAt:
          type: string
          description: Ultima actualizacion
          format: date-time
      description: Preferencias del usuario
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          description: Identificador unico del usuario
          format: int64
          example: 42
        name:
          type: string
          description: Nombres del usuario
          example: Jorge Jackson
        lastname:
          type: string
          description: Apellidos del usuario
          example: Valdivia Torreon
        email:
          type: string
          description: Correo electronico del usuario
          example: jorge.valdivia@example.com
        username:
          type: string
          description: Nombre de usuario unico
          example: UsuarioFin2026
        role:
          $ref: "#/components/schemas/Role"
        state:
          $ref: "#/components/schemas/UserState"
        moneyBalance:
          type: number
          description: Balance monetario del usuario
          example: 1500.0
        createdAt:
          type: string
          description: Fecha y hora de creacion del usuario
          format: date-time
        disabledAt:
          type: string
          description: "Fecha y hora en que el usuario fue deshabilitado, si aplica"
          format: date-time
        fullName:
          type: string
          description: Nombre completo del usuario en formato concatenado
          example: JORGE JACKSON VALDIVIA TORREON
        preferences:
          $ref: "#/components/schemas/UserPreferencesResponse"
      description: Respuesta que representa un usuario registrado en el sistema
    UserState:
      type: string
      description: Estado actual del usuario
      example: ENABLED
      enum:
      - ENABLED
      - BLOCKED
      - DISABLED
    UserPreferencesRequest:
      required:
      - currencyCode
      - timeZone
      type: object
      properties:
        timeZone:
          $ref: "#/components/schemas/TimeZone"
        currencyCode:
          maxLength: 3
          minLength: 3
          type: string
          description: Codigo de moneda por defecto
          example: PEN
        emailNotifications:
          type: boolean
          description: Notificaciones por email habilitadas
          example: true
      description: Solicitud para actualizar preferencias del usuario
    PaymentMethod:
      type: string
      description: Metodo de pago utilizado en la transaccion
      example: CREDIT_CARD
      enum:
      - CASH
      - CREDIT_CARD
      - DEBIT_CARD
      - BANK_TRANSFER
      - YAPE
      - PLIN
      - OTHER
    TransactionRequest:
      required:
      - amount
      - categoryId
      - paymentMethod
      - type
      - walletId
      type: object
      properties:
        walletId:
          type: integer
          description: Identificador unico de la billetera asociada a la transaccion
          format: int64
          example: 1
        categoryId:
          type: integer
          description: Identificador unico de la categoria asociada a la transaccion
          format: int64
          example: 101
        reasonId:
          type: integer
          description: "Identificador del motivo asociado a la transaccion, si aplica"
          format: int64
          example: 501
        description:
          type: string
          description: Descripcion de la transaccion
          example: Compra de libros universitarios
        savingGoalId:
          type: integer
          description: "Identificador de la meta de ahorro asociada, si aplica"
          format: int64
          example: 3001
        receiptId:
          type: integer
          description: "Identificador del recibo escaneado vía OCR, si aplica"
          format: int64
          example: 1
        amount:
          minimum: 0.00
          exclusiveMinimum: true
          type: number
          description: Monto de la transaccion (debe ser mayor a 0)
          example: 150.75
        paymentMethod:
          $ref: "#/components/schemas/PaymentMethod"
        type:
          $ref: "#/components/schemas/TransactionType"
        convertCurrency:
          type: boolean
          description: "Si true y receiptId presente, convierte el monto del recibo\
            \ (currencyGuess) a la moneda del wallet usando el exchange service"
          example: false
          default: false
      description: "Solicitud para registrar una transaccion asociada a un usuario,\
        \ categoria y opcionalmente a un motivo o meta de ahorro"
    TransactionType:
      type: string
      description: Tipo de transaccion (ingreso o gasto)
      example: SPENT
      enum:
      - SPENT
      - INCOME
    TransactionResponse:
      type: object
      properties:
        id:
          type: integer
          description: Identificador unico de la transaccion
          format: int64
          example: 10001
        walletId:
          type: integer
          description: Identificador unico de la billetera asociada a la transaccion
          format: int64
          example: 1
        walletCurrency:
          type: string
          description: Moneda de la billetera
          example: PEN
        walletPrimary:
          type: boolean
          description: Indica si la billetera es principal
          example: true
        categoryId:
          type: integer
          description: Identificador unico de la categoria asociada a la transaccion
          format: int64
          example: 101
        categoryName:
          type: string
          description: Nombre de la categoria asociada a la transaccion
          example: Alimentacion
        reasonId:
          type: integer
          description: "Identificador del motivo asociado a la transaccion, si aplica"
          format: int64
          example: 501
        reasonDescription:
          type: string
          description: Descripcion del motivo asociado a la transaccion
          example: Compra de utiles escolares
        savingGoalId:
          type: integer
          description: "Identificador de la meta de ahorro asociada, si aplica"
          format: int64
          example: 3001
        scheduleId:
          type: integer
          description: "Identificador de la programacion asociada, si aplica"
          format: int64
          example: 2001
        receiptId:
          type: integer
          description: "Identificador del recibo asociado, si aplica"
          format: int64
          example: 4001
        receiptImageId:
          type: integer
          description: "Identificador de la imagen del recibo asociado, si aplica"
          format: int64
          example: 4001
        amount:
          type: number
          description: Monto de la transaccion
          example: 150.75
        paymentMethod:
          $ref: "#/components/schemas/PaymentMethod"
        type:
          $ref: "#/components/schemas/TransactionType"
        createdAt:
          type: string
          description: Fecha y hora de creacion de la transaccion
