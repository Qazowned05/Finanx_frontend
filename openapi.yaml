openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8080
  description: Generated server url
tags:
- name: FCM Tokens
  description: Gestion de tokens FCM para notificaciones push
- name: ChatBot
  description: Chatbot financiero conversacional de Mis Monedas
- name: Images
  description: Almacenamiento generico de imagenes
- name: Receipts
  description: Escaneo OCR de recibos
- name: User Preferences
  description: Gestion de preferencias de usuario
paths:
  /api/v1/wallets/{id}:
    get:
      tags:
      - Wallets
      summary: Obtener billetera por ID
      operationId: findById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WalletResponse"
    put:
      tags:
      - Wallets
      summary: Actualizar billetera
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WalletResponse"
    delete:
      tags:
      - Wallets
      summary: Deshabilitar billetera
      operationId: disable
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
  /api/v1/users/{id}:
    get:
      tags:
      - Users
      summary: Buscar usuario por ID
      operationId: findUserById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
    put:
      tags:
      - Users
      summary: Actualizar datos de usuario
      operationId: updateUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /api/v1/users/me/preferences:
    get:
      tags:
      - User Preferences
      summary: Obtener preferencias del usuario
      operationId: getUserPreferences
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserPreferencesResponse"
    put:
      tags:
      - User Preferences
      summary: Actualizar preferencias del usuario
      operationId: updateUserPreferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPreferencesRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserPreferencesResponse"
    post:
      tags:
      - User Preferences
      summary: Crear preferencias del usuario
      operationId: createUserPreferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPreferencesRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserPreferencesResponse"
  /api/v1/transactions/{id}:
    get:
      tags:
      - Transactions
      summary: Buscar transaccion
      description: Obtiene una transaccion por ID.
      operationId: findTransactionById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransactionResponse"
    put:
      tags:
      - Transactions
      summary: Actualizar transaccion
      description: Actualiza una transaccion.
      operationId: updateTransaction
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransactionResponse"
    delete:
      tags:
      - Transactions
      summary: Eliminar transaccion
      description: Deshabilita una transaccion.
      operationId: transactionDelete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
  /api/v1/schedule/{id}:
    put:
      tags:
      - Schedule
      summary: Actualizar programacion
      description: Actualiza una programacion existente.
      operationId: updateSchedule
      parameters:
      - name: id
        in: path
        description: ID de la programacion
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleRequest"
        required: true
      responses:
        "200":
          description: Actualizada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ScheduleResponse"
        "400":
          description: Datos invalidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ScheduleResponse"
        "404":
          description: No encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ScheduleResponse"
  /api/v1/savings/{id}:
    get:
      tags:
      - Savings
      summary: Buscar meta
      description: Obtiene una meta de ahorro por ID.
      operationId: findSavingGoalById
      parameters:
      - name: id
        in: path
        description: ID meta
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SavingGoalResponse"
        "404":
          description: No encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SavingGoalResponse"
    put:
      tags:
      - Savings
      summary: Actualizar meta
      description: Actualiza una meta de ahorro.
      operationId: updateSavingGoal
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavingGoalRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SavingGoalResponse"
  /api/v1/reasons/{id}:
    get:
      tags:
      - Reasons
      summary: Buscar razon
      description: Obtiene una razon por ID.
      operationId: findReasonById
      parameters:
      - name: id
        in: path
        description: ID de la razon
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReasonResponse"
        "404":
          description: No encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReasonResponse"
    put:
      tags:
      - Reasons
      summary: Actualizar razon
      description: Actualiza una razon existente.
      operationId: updateReason
      parameters:
      - name: id
        in: path
        description: ID de la razon
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
        required: true
      responses:
        "200":
          description: Actualizada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReasonResponse"
        "400":
          description: Datos invalidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReasonResponse"
        "404":
          description: No encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReasonResponse"
  /api/v1/categories/{id}:
    get:
      tags:
      - Categories
      summary: Buscar categoria por ID
      description: Obtiene una categoria especifica.
      operationId: findCategoryById
      parameters:
      - name: id
        in: path
        description: ID de la categoria
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Categoria encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "404":
          description: No encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CategoryResponse"
    put:
      tags:
      - Categories
      summary: Actualizar categoria
      description: Actualiza una categoria existente.
      operationId: updateCategory
      parameters:
      - name: id
        in: path
        description: ID de la categoria
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryRequest"
        required: true
      responses:
        "200":
          description: Actualizada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "400":
          description: Datos invalidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "404":
          description: No encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CategoryResponse"
  /api/v1/budgets/{id}:
    get:
      tags:
      - Budgets
      summary: Buscar presupuesto
      description: Obtiene un presupuesto por ID.
      operationId: findBudgetById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BudgetResponse"
        "404":
          description: No encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BudgetResponse"
    put:
      tags:
      - Budgets
      summary: Actualizar presupuesto
      description: Actualiza un presupuesto.
      operationId: updateBudget
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BudgetResponse"
  /webhooks/{provider}:
    post:
      tags:
      - Webhooks
      summary: Receive provider webhook
      description: Receives an inbound webhook notification from a payment provider.
      operationId: receiveWebhook
      parameters:
      - name: provider
        in: path
        description: Payment provider
        required: true
        schema:
          $ref: "#/components/schemas/PaymentProvider"
      - name: X-Signature
        in: header
        description: Signature header sent by the provider
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: string
        required: true
      responses:
        "200":
          description: Accepted (duplicates are idempotent)
        "401":
          description: Invalid signature
  /api/v1/wallets:
    get:
      tags:
      - Wallets
      summary: Listar billeteras del usuario autenticado
      description: "Lista paginada con page, size y sort estándar."
      operationId: listWallets
      parameters:
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          minimum: 0
          type: integer
          default: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          minimum: 1
          type: integer
          default: 50
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          items:
            type: string
          default:
          - "id,ASC"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseWalletResponse"
    post:
      tags:
      - Wallets
      summary: Crear billetera
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WalletResponse"
  /api/v1/users/{id}/reset-data:
    post:
      tags:
      - Users
      summary: Resetear datos de usuario
      operationId: resetUserData
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
  /api/v1/users/{id}/disable:
    post:
      tags:
      - Users
      summary: Deshabilitar usuario
      operationId: disableUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /api/v1/users/{id}/block:
    post:
      tags:
      - Users
      summary: Bloquear usuario
      operationId: blockUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /api/v1/users/{id}/activate:
    post:
      tags:
      - Users
      summary: Habilitar usuario
      operationId: enableUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /api/v1/users/register:
    post:
      tags:
      - Users
      summary: Registrar un nuevo usuario
      operationId: registerUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LoginResponse"
  /api/v1/transactions:
    get:
      tags:
      - Transactions
      summary: Listar transacciones del usuario
      description: "Lista paginada del usuario autenticado. Admite filtros por active,\
        \ type, walletId, categoryId y rango from/to; el orden usa sort estándar."
      operationId: listTransactions
      parameters:
      - name: active
        in: query
        required: false
        schema:
          type: boolean
      - name: type
        in: query
        required: false
        schema:
          $ref: "#/components/schemas/TransactionType"
      - name: walletId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: categoryId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          minimum: 0
          type: integer
          default: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          minimum: 1
          type: integer
          default: 50
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          items:
            type: string
          default:
          - "createdAt,DESC"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseTransactionResponse"
    post:
      tags:
      - Transactions
      summary: Crear transaccion
      description: Crea una nueva transaccion.
      operationId: createTransaction
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransactionResponse"
  /api/v1/subscriptions:
    get:
      tags:
      - Subscriptions
      summary: List subscriptions by user
      description: Lists subscriptions of the authenticated user with optional state
        and pagination/sort parameters.
      operationId: listSubscriptions
      parameters:
      - name: state
        in: query
        required: false
        schema:
          $ref: "#/components/schemas/SubscriptionState"
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          minimum: 0
          type: integer
          default: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          minimum: 1
          type: integer
          default: 50
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          items:
            type: string
          default:
          - "createdAt,DESC"
      responses:
        "200":
          description: List retrieved
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseSubscriptionResponse"
        "404":
          description: User not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseSubscriptionResponse"
    post:
      tags:
      - Subscriptions
      summary: Create subscription
      description: "Creates a new subscription in PENDING state, awaiting payment\
        \ confirmation."
      operationId: createSubscription
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        "400":
          description: Invalid data
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
  /api/v1/subscriptions/{id}/renew:
    post:
      tags:
      - Subscriptions
      summary: Renew subscription
      description: Opens the next billing period for an active subscription.
      operationId: renewSubscription
      parameters:
      - name: id
        in: path
        description: Subscription id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Renewed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        "404":
          description: Not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
  /api/v1/subscriptions/{id}/cancel:
    post:
      tags:
      - Subscriptions
      summary: Cancel subscription
      description: Cancels a subscription and disables auto renew.
      operationId: cancelSubscription
      parameters:
      - name: id
        in: path
        description: Subscription id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Canceled
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        "404":
          description: Not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
  /api/v1/subscriptions/{id}/activate:
    post:
      tags:
      - Subscriptions
      summary: Activate subscription
      description: Activates a PENDING or PAST_DUE subscription and opens a new billing
        period.
      operationId: activateSubscription
      parameters:
      - name: id
        in: path
        description: Subscription id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Activated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        "404":
          description: Not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        "409":
          description: Invalid state transition
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
  /api/v1/schedule:
    get:
      tags:
      - Schedule
      summary: Listar programaciones por usuario y estado
      description: Lista programaciones activas paginadas con filtro opcional state.
      operationId: listSchedules
      parameters:
      - name: state
        in: query
        required: false
        schema:
          $ref: "#/components/schemas/ScheduleState"
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          minimum: 0
          type: integer
          default: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          minimum: 1
          type: integer
          default: 50
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          items:
            type: string
          default:
          - "nextRunAt,ASC"
      responses:
        "200":
          description: Listado obtenido
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseScheduleResponse"
    post:
      tags:
      - Schedule
      summary: Crear programacion
      description: Crea una nueva programacion.
      operationId: createSchedule
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleRequest"
        required: true
      responses:
        "201":
          description: Programacion creada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ScheduleResponse"
        "400":
          description: Datos invalidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ScheduleResponse"
  /api/v1/schedule/{id}/resume:
    post:
      tags:
      - Schedule
      summary: Reanudar programacion
      description: Reanuda una programacion pausada.
      operationId: resumeSchedule
      parameters:
      - name: id
        in: path
        description: ID de la programacion
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Reanudada
        "404":
          description: No encontrada
  /api/v1/schedule/{id}/pause:
    post:
      tags:
      - Schedule
      summary: Pausar programacion
      description: Pausa una programacion.
      operationId: pauseSchedule
      parameters:
      - name: id
        in: path
        description: ID de la programacion
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Pausada
        "404":
          description: No encontrada
  /api/v1/schedule/{id}/cancel:
    post:
      tags:
      - Schedule
      summary: Cancelar programacion
      description: Cancela una programacion.
      operationId: cancelSchedule
      parameters:
      - name: id
        in: path
        description: ID de la programacion
